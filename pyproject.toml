[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estudio-video"
version = "0.1.0"
description = "Genera video e imagen con OpenRouter a través de ComfyUI, guiado por un agente y con control de gasto."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = []

[project.optional-dependencies]
limpieza = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
estudio = "estudio_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
